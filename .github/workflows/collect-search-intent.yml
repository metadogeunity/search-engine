name: Collect Search Intent

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Vercel collector
        env:
          VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${VERCEL_APP_URL:-}" ]; then
            echo "Missing GitHub Actions secret: VERCEL_APP_URL"
            exit 1
          fi

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing GitHub Actions secret: CRON_SECRET"
            exit 1
          fi

          URL="${VERCEL_APP_URL%/}/api/cron/collect"

          response=$(curl --fail-with-body --silent --show-error             --max-time 120             --retry 2             --retry-delay 3             -H "Authorization: Bearer ${CRON_SECRET}"             "${URL}")

          echo "${response}"
